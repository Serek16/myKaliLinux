# S - Shift
# C - Ctrl
# M - Alt

# Remap Prefix from `Ctrl + B` to `Ctrl + A`
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use vi key schema
setw -g mode-keys vi

# Set zsh as default shell
set-option -g default-shell /bin/zsh

# Add mouse support
set -g mouse on

# Disable Tmux's right-click menu
unbind -n MouseDown3Pane

# Shortcut `Prefix -> R` for reloading tmux config
bind-key r source ~/.tmux.conf

# Split vertically/horizontally (add pane left/right/up/down) `Ctrl + Alt + {Left,Right,Up,Down}`
bind-key -n C-M-Left  split-window -hbf -c "#{pane_current_path}"
bind-key -n C-M-Right split-window -hf  -c "#{pane_current_path}"
bind-key -n C-M-Up    split-window -vbf -c "#{pane_current_path}"
bind-key -n C-M-Down  split-window -vf  -c "#{pane_current_path}"

# Move cursor to left/right/upper/bottom pane `Alt + {Left,Right,Up,Down}`
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

# Swap to horizontal / vertical layout or switch pane to the left/right/top/bottom `Shift + Alt + {Left,Right,Up,Down}`
bind-key -n S-M-Left  if-shell -F '#{&&:#{||:#{==:#{pane_at_top},0},#{==:#{pane_at_bottom},0}},#{pane_at_left}}'   'select-pane -m; split-window -h -f -b; swap-pane -s !; kill-pane; select-pane -M' 'swap-pane -U'
bind-key -n S-M-Right if-shell -F '#{&&:#{||:#{==:#{pane_at_top},0},#{==:#{pane_at_bottom},0}},#{pane_at_right}}'  'select-pane -m; split-window -h -f;    swap-pane -s !; kill-pane; select-pane -M' 'swap-pane -D'
bind-key -n S-M-Up    if-shell -F '#{&&:#{||:#{==:#{pane_at_left},0},#{==:#{pane_at_right},0}},#{pane_at_top}}'    'select-pane -m; split-window -v -f -b; swap-pane -s !; kill-pane; select-pane -M' 'swap-pane -U'
bind-key -n S-M-Down  if-shell -F '#{&&:#{||:#{==:#{pane_at_left},0},#{==:#{pane_at_right},0}},#{pane_at_bottom}}' 'select-pane -m; split-window -v -f;    swap-pane -s !; kill-pane; select-pane -M' 'swap-pane -D'

# Close active pane `Alt + r`
bind-key -n M-r kill-pane

# Disable that behaviour when you scroll up, then select text
#  and when you release, it automatically jump to the bottom
unbind -T copy-mode    MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Use `Ctrl + C` to copy selected text in a copy mode
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# Allow `Ctrl + a` to pass through to the application
bind -n C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Move pane to specfic window
bind-key j command-prompt -p "Join pane to window:" "join-pane -t ':%%'"
